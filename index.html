      background-color: #0F0A24;

      background: rgba(255, 255, 255, 0.96);

      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);

    }

    .pixel-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #1E1B4B;
    }

    .pixel-badge {
      border: 2px solid #1E1B4B;
      box-shadow: 2px 2px 0px #1E1B4B;
      font-family: 'Pixelify Sans', monospace;

      background-color: #FFFFFF !important;
      caret-color: #6B3DF5;

      background-color: #0F0A24 !important;

        transform: translateX(-15%);
      }

      animation: floatCloud 25s linear infinite;

      100% {

      }

      50% {
        opacity: 0.2;
      }
    }

        display: block !important;
      }

      display: none;

    // Interactive Graph / Chart Canvas Component
    const InteractiveChart = ({ graphData }) => {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !graphData || !window.Chart) return;

        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        const ctx = canvasRef.current.getContext('2d');
        const colors = [
          '#6B3DF5', '#F6C445', '#6EE7B7', '#7DD3FC', '#F472B6', '#D8B4FE'
        ];

        const datasets = (graphData.datasets || []).map((ds, idx) => ({
          label: ds.label || `Dataset ${idx + 1}`,
          data: ds.data || [],
          backgroundColor: graphData.type === 'pie' || graphData.type === 'doughnut' ? colors : colors[idx % colors.length] + 'BB',
          borderColor: '#1E1B4B',
          borderWidth: 3,
          fill: graphData.type === 'line' ? false : true
        }));

        chartInstanceRef.current = new window.Chart(ctx, {
          type: graphData.type || 'bar',
          data: {
            labels: graphData.labels || ['Sample 1', 'Sample 2'],
            datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              title: { display: true, text: graphData.title || 'Practical Benchmark Chart', font: { size: 14, weight: 'bold', family: 'Pixelify Sans' } },
              legend: { position: 'bottom', labels: { font: { family: 'Pixelify Sans' } } }
            }
          }
        });

        return () => {
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        };
      }, [graphData]);

      const downloadPNG = () => {
        if (!canvasRef.current) return;
        const image = canvasRef.current.toDataURL("image/png");
        const a = document.createElement("a");
        a.href = image;
        a.download = `pixel-chart-${Date.now()}.png`;
        a.click();
      };

      return (
        <div className="space-y-4">
          <div className="h-64 sm:h-80 w-full relative bg-pixelCream dark:bg-royalPurple-900/50 p-4 rounded-2xl border-2 border-royalPurple-900">
            <canvas ref={canvasRef} />

            <button
              onClick={downloadPNG}
              className="px-3.5 py-2 rounded-xl pixel-btn bg-royalPurple-600 text-pixelCream hover:bg-royalPurple-700 flex items-center gap-1.5"
            >
              <Icon name="download" className="w-3.5 h-3.5" /> Download Chart PNG

            </button>
          </div>
        </div>
      );

                <h1 className="text-3xl font-extrabold font-pixel text-haldiYellow-400 mt-2">{subject.name}</h1>
                <p className="text-xs text-royalPurple-100 mt-1">{subject.description}</p>
              </div>
              {isAdmin && (
                <button
                  onClick={() => { setEditingPrac(null); setIsPracModalOpen(true); }}
                  className="px-5 py-3 rounded-xl pixel-btn bg-haldiYellow-500 text-royalPurple-950 font-pixel font-bold text-xs hover:bg-haldiYellow-400 inline-flex items-center gap-2 shadow-lg"
                >
                  <Icon name="plus" className="w-4 h-4" /> Craft Quest
                </button>
              )}
            </div>
          </div>

          <div className="flex items-center gap-2 overflow-x-auto pb-2 font-pixel">
            {['All', 'Completed', 'In Progress', 'Draft'].map(st => (
              <button
                key={st}
                onClick={() => setStatusFilter(st)}
                className={`px-4 py-2 rounded-xl text-xs font-bold pixel-btn ${statusFilter === st ? 'bg-royalPurple-600 text-pixelCream' : 'bg-pixelCream text-slate-700'}`}
              >
                {st}
              </button>
            ))}
          </div>

          <div className="space-y-4">
            {filtered.map(prac => (
              <div
                key={prac.id}
                onClick={() => setCurrentRoute({ page: 'details', subjectId: subject.id, practicalId: prac.id })}
                className="pixel-card pixel-card-hover rounded-2xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 cursor-pointer border-3 border-royalPurple-900"
              >
                <div className="flex items-start gap-4">
                  <div className="w-12 h-12 rounded-xl bg-royalPurple-600 text-haldiYellow-400 font-pixel font-extrabold flex items-center justify-center shrink-0 pixel-badge">
                    Q{prac.practicalNo < 10 ? `0${prac.practicalNo}` : prac.practicalNo}
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-pixel font-bold text-slate-500">Quest #{prac.practicalNo}</span>
                      <span className="px-2.5 py-0.5 rounded-full text-[10px] font-pixel font-extrabold bg-haldiYellow-500 text-royalPurple-950 pixel-badge">
                        {prac.status}
                      </span>
                    </div>
                    <h4 className="text-lg font-bold text-royalPurple-900 dark:text-pixelCream mt-1">{prac.title}</h4>
                    {prac.shortDescription && <p className="text-xs text-slate-600 dark:text-slate-300 mt-1">{prac.shortDescription}</p>}
                  </div>
                </div>

                <div className="flex items-center gap-2 self-end sm:self-center">
                  <div onClick={(e) => e.stopPropagation()} className="flex items-center gap-1">
                    {isAdmin && (
                      <>
                        <button onClick={() => duplicatePractical(subject.id, prac.id)} title="Duplicate Practical" className="p-2 text-slate-500 hover:text-royalPurple-600">
                          <Icon name="duplicate" className="w-4 h-4" />
                        </button>
                        <button onClick={() => { setEditingPrac(prac); setIsPracModalOpen(true); }} title="Edit Metadata" className="p-2 text-slate-500 hover:text-royalPurple-600">
                          <Icon name="edit" className="w-4 h-4" />
                        </button>
                        <button onClick={() => { if (confirm(`Delete practical quest "${prac.title}"?`)) deletePractical(subject.id, prac.id); }} title="Delete Practical" className="p-2 text-slate-500 hover:text-rose-600">
                          <Icon name="trash" className="w-4 h-4" />
                        </button>
                      </>
                    )}
                  </div>
                  <span className="text-xs font-pixel font-extrabold text-royalPurple-600 dark:text-haldiYellow-400 flex items-center gap-1 ml-2">
                    Open Spellbook <Icon name="chevronRight" className="w-4 h-4" />
                  </span>
                </div>
              </div>
            ))}
          </div>

          <PracticalModal
            isOpen={isPracModalOpen}
            onClose={() => setIsPracModalOpen(false)}
            onSave={(obj) => {
              if (editingPrac) updatePractical(subject.id, editingPrac.id, obj);
              else addPractical(subject.id, obj);
            }}
            practicalToEdit={editingPrac}
            nextNo={practicalsList.length + 1}
          />
        </div>
      );
    };

    // Practical Details View with 14 Editable Sections
    const PracticalDetailsView = () => {
      const { data, isAdmin, currentRoute, setCurrentRoute, updatePractical, duplicatePractical, deletePractical, showToast } = useContext(DataContext);
      const subject = data.subjects.find(s => s.id === currentRoute.subjectId);
      const practical = subject?.practicals?.find(p => p.id === currentRoute.practicalId);

      const [isEditing, setIsEditing] = useState(false);
      const [sections, setSections] = useState({});
      const [codeSections, setCodeSections] = useState([]);
      const [table, setTable] = useState(null);
      const [graphData, setGraphData] = useState(null);
      const [vivaList, setVivaList] = useState([]);
      const [copiedIdx, setCopiedIdx] = useState(null);
      const [fullScreenCode, setFullScreenCode] = useState(null);

      useEffect(() => {
        if (practical) {
          const secs = practical.sections || {};
          setSections({
            aim: secs.aim || practical.title || '',
            objective: secs.objective || '',
            theory: secs.theory || secs.information || '',
            algorithm: secs.algorithm || secs.procedure || '',
            flowchart: secs.flowchart || '',
            output: secs.output || '',
            observation: secs.observation || '',
            result: secs.result || '',
            conclusion: secs.conclusion || '',
            references: secs.references || '',
            discussion: secs.discussion || ''
          });
          setCodeSections(secs.codeSections || []);
          setTable(secs.comparisonTable || {
            title: "Algorithm Power & Complexity Matrix",
            headers: ["Metric", "Approach A", "Approach B"],
            rows: [["Time Complexity", "", ""], ["Space Complexity", "", ""]]
          });
          setGraphData(secs.graphData || {
            title: "Execution Benchmark Chart",
            type: "bar",
            labels: ["Input 100", "Input 500", "Input 1000"],
            datasets: [{ label: "Execution Time (ms)", data: [5, 25, 60] }]
          });
          setVivaList(secs.vivaQuestions || [
            { q: "What is the time complexity of this algorithm?", a: "Best case: O(N log N), Worst case: O(N^2)" }
          ]);
        }
      }, [practical]);

      if (!subject || !practical) return <div className="p-8 text-center font-pixel">Practical not found.</div>;

      const handleSave = () => {
        updatePractical(subject.id, practical.id, {
          title: sections.aim || practical.title,
          sections: {
            ...sections,
            codeSections,
            comparisonTable: table,
            graphData,
            vivaQuestions: vivaList
          }
        });
        setIsEditing(false);
      };

      const handleCopyCode = (text, idx) => {
        navigator.clipboard.writeText(text);
        setCopiedIdx(idx);
        showToast("📜 Code Copied to Clipboard!");
        setTimeout(() => setCopiedIdx(null), 2000);
      };

      const addCodeSnippet = () => {
        setCodeSections([...codeSections, { id: `c-${Date.now()}`, title: `Snippet #${codeSections.length + 1}`, language: 'cpp', code: '' }]);
      };

      const updateSectionText = (key, val) => {
        setSections(prev => ({ ...prev, [key]: val }));
      };

      const formatText = (key, tag) => {
        const selected = window.getSelection().toString();
        if (!selected) return;
        const currentVal = sections[key] || '';
        let formatted = selected;
        if (tag === 'b') formatted = `**${selected}**`;
        if (tag === 'i') formatted = `*${selected}*`;
        if (tag === 'u') formatted = `<u>${selected}</u>`;
        if (tag === 'math') formatted = `$${selected}$`;
        updateSectionText(key, currentVal.replace(selected, formatted));
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
          {/* Breadcrumbs */}
          <div className="flex items-center gap-2 text-xs font-pixel text-slate-500 no-print">
            <span onClick={() => setCurrentRoute({ page: 'home', subjectId: null, practicalId: null })} className="cursor-pointer hover:text-royalPurple-600 font-bold flex items-center gap-1">
              <Icon name="home" className="w-3.5 h-3.5" /> Home
            </span>
            <Icon name="chevronRight" className="w-3.5 h-3.5" />
            <span onClick={() => setCurrentRoute({ page: 'subject', subjectId: subject.id, practicalId: null })} className="cursor-pointer hover:text-royalPurple-600 font-bold">
              {subject.name}
            </span>
            <Icon name="chevronRight" className="w-3.5 h-3.5" />
            <span className="text-royalPurple-900 dark:text-haldiYellow-400 font-extrabold">Quest #{practical.practicalNo}</span>
          </div>

          {/* Practical Title Header Banner */}
          <div className="pixel-card rounded-3xl p-6 sm:p-8 border-4 border-royalPurple-900 bg-gradient-to-r from-royalPurple-700 to-royalPurple-800 text-pixelCream shadow-2xl">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <span className="px-3 py-1 text-xs font-mono font-extrabold bg-haldiYellow-500 text-royalPurple-950 rounded-md pixel-badge">
                  Quest #{practical.practicalNo}
                </span>
                <h1 className="text-3xl font-extrabold font-pixel text-haldiYellow-400 mt-2">{practical.title}</h1>
              </div>

              {/* Practical Action Toolbar */}
              <div className="flex flex-wrap items-center gap-2 no-print font-pixel">
                <button
                  onClick={() => window.print()}
                  className="px-3.5 py-2 rounded-xl pixel-btn bg-royalPurple-600 text-pixelCream text-xs font-bold hover:bg-royalPurple-500 flex items-center gap-1.5"
                  title="Print Lab Report"
                >
                  <Icon name="print" className="w-4 h-4" /> Print
                </button>
                {isAdmin ? (
                  <>
                    <button
                      onClick={() => duplicatePractical(subject.id, practical.id)}
                      className="px-3.5 py-2 rounded-xl pixel-btn bg-royalPurple-600 text-haldiYellow-400 text-xs font-bold hover:bg-royalPurple-500 flex items-center gap-1.5"
                      title="Duplicate Quest"
                    >
                      <Icon name="duplicate" className="w-4 h-4" /> Clone
                    </button>
                    <button
                      onClick={() => isEditing ? handleSave() : setIsEditing(true)}
                      className="px-4 py-2 rounded-xl pixel-btn bg-haldiYellow-500 text-royalPurple-950 text-xs font-extrabold hover:bg-haldiYellow-400 flex items-center gap-1.5 shadow-md"
                    >
                      <Icon name={isEditing ? 'check' : 'edit'} className="w-4 h-4" />
                      {isEditing ? 'Save Quest' : 'Edit Spellbook'}
                    </button>
                    <button
                      onClick={() => { if (confirm(`Delete Quest Practical #${practical.practicalNo}?`)) deletePractical(subject.id, practical.id); }}
                      className="p-2.5 rounded-xl pixel-btn bg-rose-700 text-white hover:bg-rose-800"
                      title="Delete Quest"
                    >
                      <Icon name="trash" className="w-4 h-4" />
                    </button>
                  </>
                ) : (
                  <span className="px-3.5 py-2 rounded-xl bg-pixelCream text-royalPurple-900 text-xs font-pixel font-bold flex items-center gap-1 pixel-badge">
                    <Icon name="eye" className="w-4 h-4" /> View-Only
                  </span>
                )}
              </div>
            </div>
          </div>

          {/* 14 EDITABLE SECTIONS */}
          <div className="space-y-8">
            {/* Section 1: Aim */}
            <div className="pixel-card rounded-3xl p-6 border-3 border-royalPurple-900 space-y-3">
              <h2 className="text-lg font-pixel font-extrabold text-royalPurple-900 dark:text-haldiYellow-400 flex items-center gap-2">
                <Icon name="sword" className="w-5 h-5 text-haldiYellow-500" /> 1. Quest Aim
              </h2>
              {isEditing ? (
                <input type="text" value={sections.aim} onChange={(e) => updateSectionText('aim', e.target.value)} className="w-full bg-pixelCream dark:bg-royalPurple-900 border-2 border-royalPurple-900 rounded-xl p-3 text-sm font-bold focus:outline-none" />
              ) : (
                <p className="text-sm font-semibold text-slate-800 dark:text-slate-200">{sections.aim || "No aim defined."}</p>
              )}
            </div>

            {/* Section 2: Objective */}
            <div className="pixel-card rounded-3xl p-6 border-3 border-royalPurple-900 space-y-3">
              <h2 className="text-lg font-pixel font-extrabold text-royalPurple-900 dark:text-haldiYellow-400 flex items-center gap-2">
                <Icon name="info" className="w-5 h-5 text-haldiYellow-500" /> 2. Objectives
              </h2>
              {isEditing ? (
                <textarea rows="3" value={sections.objective} onChange={(e) => updateSectionText('objective', e.target.value)} placeholder="List objectives..." className="w-full bg-pixelCream dark:bg-royalPurple-900 border-2 border-royalPurple-900 rounded-xl p-3 text-xs focus:outline-none" />
              ) : (
                <p className="text-sm text-slate-700 dark:text-slate-300 whitespace-pre-wrap">{sections.objective || "No objectives added."}</p>
              )}
            </div>

            {/* Section 3: Theory */}
            <div className="pixel-card rounded-3xl p-6 border-3 border-royalPurple-900 space-y-3">
              <div className="flex items-center justify-between">
                <h2 className="text-lg font-pixel font-extrabold text-royalPurple-900 dark:text-haldiYellow-400 flex items-center gap-2">
                  <Icon name="book" className="w-5 h-5 text-haldiYellow-500" /> 3. Theory & Background
                </h2>
                {isEditing && (
                  <div className="flex items-center gap-1 text-xs font-pixel">
                    <button type="button" onClick={() => formatText('theory', 'b')} className="px-2 py-1 bg-haldiYellow-500 text-royalPurple-950 font-bold rounded">B</button>
                    <button type="button" onClick={() => formatText('theory', 'i')} className="px-2 py-1 bg-haldiYellow-500 text-royalPurple-950 italic rounded">I</button>
                    <button type="button" onClick={() => formatText('theory', 'u')} className="px-2 py-1 bg-haldiYellow-500 text-royalPurple-950 underline rounded">U</button>
                    <button type="button" onClick={() => formatText('theory', 'math')} className="px-2 py-1 bg-haldiYellow-500 text-royalPurple-950 font-mono text-[10px]">Math</button>
                  </div>
                )}
              </div>
              {isEditing ? (
                <textarea rows="6" value={sections.theory} onChange={(e) => updateSectionText('theory', e.target.value)} placeholder="Enter theory information..." className="w-full bg-pixelCream dark:bg-royalPurple-900 border-2 border-royalPurple-900 rounded-xl p-3 text-xs focus:outline-none" />
              ) : (
                <p className="text-sm text-slate-700 dark:text-slate-300 whitespace-pre-wrap">{sections.theory || "No theory added."}</p>
              )}
            </div>

            {/* Section 4: Algorithm */}
            <div className="pixel-card rounded-3xl p-6 border-3 border-royalPurple-900 space-y-3">
              <h2 className="text-lg font-pixel font-extrabold text-royalPurple-900 dark:text-haldiYellow-400 flex items-center gap-2">
                <Icon name="code" className="w-5 h-5 text-haldiYellow-500" /> 4. Algorithm Steps
              </h2>
              {isEditing ? (
                <textarea rows="6" value={sections.algorithm} onChange={(e) => updateSectionText('algorithm', e.target.value)} placeholder="Step 1: Start..." className="w-full bg-pixelCream dark:bg-royalPurple-900 border-2 border-royalPurple-900 rounded-xl p-3 text-xs font-mono focus:outline-none" />
              ) : (
                <pre className="text-xs font-mono text-royalPurple-950 dark:text-pixelCream bg-royalPurple-50 dark:bg-royalPurple-900/50 p-4 rounded-xl border-2 border-royalPurple-900 whitespace-pre-wrap">{sections.algorithm || "No algorithm steps added."}</pre>
              )}
            </div>

            {/* Section 5: Flowchart */}
            <div className="pixel-card rounded-3xl p-6 border-3 border-royalPurple-900 space-y-3">
              <h2 className="text-lg font-pixel font-extrabold text-royalPurple-900 dark:text-haldiYellow-400 flex items-center gap-2">
                <Icon name="table" className="w-5 h-5 text-haldiYellow-500" /> 5. Flowchart Diagram
              </h2>
              {isEditing ? (
                <textarea rows="5" value={sections.flowchart} onChange={(e) => updateSectionText('flowchart', e.target.value)} placeholder="[START] -> [INPUT DATA] -> [PROCESS] -> [OUTPUT] -> [END]" className="w-full bg-pixelCream dark:bg-royalPurple-900 border-2 border-royalPurple-900 rounded-xl p-3 text-xs font-mono focus:outline-none" />
              ) : (
                <div className="p-4 rounded-xl bg-royalPurple-50 dark:bg-royalPurple-900/50 border-2 border-royalPurple-900 font-mono text-xs text-royalPurple-900 dark:text-haldiYellow-400 whitespace-pre-wrap">
                  {sections.flowchart || "[START] ──> [PROCESS DATA] ──> [OUTPUT RESULT] ──> [END]"}
                </div>
              )}
            </div>

            {/* Section 6: Program Code */}
            <div className="pixel-card rounded-3xl p-6 border-3 border-royalPurple-900 space-y-4">
              <div className="flex items-center justify-between">
                <h2 className="text-lg font-pixel font-extrabold text-royalPurple-900 dark:text-haldiYellow-400 flex items-center gap-2">
                  <Icon name="code" className="w-5 h-5 text-haldiYellow-500" /> 6. Source Program Code
                </h2>
                {isEditing && (
                  <button onClick={addCodeSnippet} className="px-3.5 py-1.5 rounded-xl text-xs font-pixel font-bold pixel-btn bg-haldiYellow-500 text-royalPurple-950">
                    + Add Code Snippet
                  </button>
                )}
              </div>

              {codeSections.map((sec, idx) => (
                <div key={sec.id || idx} className="rounded-2xl border-2 border-royalPurple-900 bg-royalPurple-900 text-pixelCream overflow-hidden shadow-lg">
                  <div className="flex items-center justify-between px-4 py-2.5 bg-royalPurple-800 border-b-2 border-royalPurple-950 font-pixel">
                    <div className="flex items-center gap-3">
                      {isEditing ? (
                        <input type="text" value={sec.title} onChange={(e) => {
                          const updated = [...codeSections]; updated[idx].title = e.target.value; setCodeSections(updated);
                        }} className="bg-royalPurple-950 border border-royalPurple-600 px-2 py-1 text-xs font-bold text-haldiYellow-400 rounded" />
                      ) : (
                        <span className="text-xs font-extrabold text-haldiYellow-400">{sec.title || `Snippet #${idx + 1}`}</span>
                      )}
                      <span className="px-2 py-0.5 text-[10px] font-mono font-bold bg-royalPurple-950 text-pixelMint rounded">
                        {sec.language || 'cpp'}
                      </span>
                    </div>

                    <div className="flex items-center gap-2">
                      <button onClick={() => setFullScreenCode(sec)} className="p-1 text-pixelCream hover:text-haldiYellow-400" title="Full Screen View">
                        <Icon name="fullScreen" className="w-4 h-4" />
                      </button>
                      <button onClick={() => handleCopyCode(sec.code, idx)} className="px-2.5 py-1 text-xs bg-royalPurple-950 hover:bg-royalPurple-700 text-haldiYellow-400 rounded flex items-center gap-1 pixel-badge">
                        <Icon name={copiedIdx === idx ? 'check' : 'copy'} className="w-3.5 h-3.5" />
                        {copiedIdx === idx ? 'Copied' : 'Copy Code'}
                      </button>
                    </div>
                  </div>

                  {/* Code Editor with Line Numbers */}
                  <div className="flex p-4 overflow-x-auto text-xs font-mono">
                    <div className="pr-4 border-r-2 border-royalPurple-800 text-purple-400 select-none text-right">
                      {(sec.code || "").split('\n').map((_, lineIdx) => (
                        <div key={lineIdx}>{lineIdx + 1}</div>
                      ))}
                    </div>
                    <div className="pl-4 flex-1">
                      {isEditing ? (
                        <textarea rows="8" value={sec.code} onChange={(e) => {
                          const updated = [...codeSections]; updated[idx].code = e.target.value; setCodeSections(updated);
                        }} placeholder="Paste code snippet here..." className="w-full bg-transparent text-pixelCream focus:outline-none" />
                      ) : (
                        <pre className="text-pixelCream whitespace-pre-wrap"><code>{sec.code || "// No code entered."}</code></pre>
                      )}
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* Section 7: Output */}
            <div className="pixel-card rounded-3xl p-6 border-3 border-royalPurple-900 space-y-3">
              <h2 className="text-lg font-pixel font-extrabold text-royalPurple-900 dark:text-haldiYellow-400 flex items-center gap-2">
                <Icon name="code" className="w-5 h-5 text-haldiYellow-500" /> 7. Program Output
              </h2>
              {isEditing ? (
                <textarea rows="4" value={sections.output} onChange={(e) => updateSectionText('output', e.target.value)} placeholder="Console output result..." className="w-full bg-pixelCream dark:bg-royalPurple-900 border-2 border-royalPurple-900 rounded-xl p-3 text-xs font-mono focus:outline-none" />
              ) : (
                <pre className="text-xs font-mono text-pixelMint bg-royalPurple-950 p-4 rounded-xl border-2 border-royalPurple-900 whitespace-pre-wrap">{sections.output || "No output recorded."}</pre>
              )}
            </div>

            {/* Section 8: Comparison Table & Graph */}
            <div className="pixel-card rounded-3xl p-6 border-3 border-royalPurple-900 space-y-4">
              <h2 className="text-lg font-pixel font-extrabold text-royalPurple-900 dark:text-haldiYellow-400 flex items-center gap-2">
                <Icon name="table" className="w-5 h-5 text-haldiYellow-500" /> 8. Comparison Table & Chart
              </h2>

              <div className="overflow-x-auto rounded-xl border-2 border-royalPurple-900 font-mono">
                <table className="w-full text-xs text-left">
                  <thead className="bg-royalPurple-700 text-haldiYellow-400 font-pixel">
                    <tr>
                      {table?.headers?.map((h, cIdx) => (
                        <th key={cIdx} className="p-3 border-r-2 border-royalPurple-900 font-bold">{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y-2 divide-royalPurple-900">
                    {table?.rows?.map((row, rIdx) => (
                      <tr key={rIdx} className="hover:bg-haldiYellow-100/50 dark:hover:bg-royalPurple-900/50">
                        {row.map((cell, cIdx) => (
                          <td key={cIdx} className="p-3 border-r-2 border-royalPurple-900 font-semibold">{cell || "—"}</td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              {graphData && (
                <div className="pt-4 border-t-2 border-royalPurple-900 space-y-3">
                  <div className="flex items-center justify-between">
                    <h3 className="text-sm font-pixel font-extrabold text-royalPurple-900 dark:text-haldiYellow-400 flex items-center gap-2">
                      <Icon name="chart" className="w-4 h-4 text-haldiYellow-500" /> Graphical Analysis
                    </h3>

                    <div className="flex items-center gap-2 font-pixel">
                      <label className="text-xs font-semibold">Chart Type:</label>
                      <select
                        value={graphData.type || 'bar'}
                        onChange={(e) => setGraphData({ ...graphData, type: e.target.value })}
                        className="bg-royalPurple-700 text-haldiYellow-400 border-2 border-royalPurple-900 text-xs px-2.5 py-1 rounded-lg font-bold"
                      >
                        <option value="bar">Bar Chart</option>
                        <option value="line">Line Chart</option>
                        <option value="pie">Pie Chart</option>
                        <option value="doughnut">Doughnut Chart</option>
                        <option value="radar">Radar Chart</option>
                      </select>
                    </div>
                  </div>

                  <InteractiveChart graphData={graphData} />
                </div>
              )}
            </div>

            {/* Section 9: Observation */}
            <div className="pixel-card rounded-3xl p-6 border-3 border-royalPurple-900 space-y-3">
              <h2 className="text-lg font-pixel font-extrabold text-royalPurple-900 dark:text-haldiYellow-400 flex items-center gap-2">
                <Icon name="info" className="w-5 h-5 text-haldiYellow-500" /> 9. Observations
              </h2>
              {isEditing ? (
                <textarea rows="3" value={sections.observation} onChange={(e) => updateSectionText('observation', e.target.value)} placeholder="Observation notes..." className="w-full bg-pixelCream dark:bg-royalPurple-900 border-2 border-royalPurple-900 rounded-xl p-3 text-xs focus:outline-none" />
              ) : (
                <p className="text-sm text-slate-700 dark:text-slate-300 whitespace-pre-wrap">{sections.observation || "No observations recorded."}</p>
              )}
            </div>

            {/* Section 10: Result */}
            <div className="pixel-card rounded-3xl p-6 border-3 border-royalPurple-900 space-y-3">
              <h2 className="text-lg font-pixel font-extrabold text-royalPurple-900 dark:text-haldiYellow-400 flex items-center gap-2">
                <Icon name="check" className="w-5 h-5 text-haldiYellow-500" /> 10. Experimental Result
              </h2>
              {isEditing ? (
                <textarea rows="3" value={sections.result} onChange={(e) => updateSectionText('result', e.target.value)} placeholder="Result findings..." className="w-full bg-pixelCream dark:bg-royalPurple-900 border-2 border-royalPurple-900 rounded-xl p-3 text-xs focus:outline-none" />
              ) : (
                <p className="text-sm font-semibold text-slate-800 dark:text-slate-200">{sections.result || "Verified experimental result."}</p>
              )}
            </div>

            {/* Section 11: Conclusion */}
            <div className="pixel-card rounded-3xl p-6 border-3 border-royalPurple-900 space-y-3">
              <h2 className="text-lg font-pixel font-extrabold text-royalPurple-900 dark:text-haldiYellow-400 flex items-center gap-2">
                <Icon name="check" className="w-5 h-5 text-haldiYellow-500" /> 11. Conclusion
              </h2>
              {isEditing ? (
                <textarea rows="4" value={sections.conclusion} onChange={(e) => updateSectionText('conclusion', e.target.value)} placeholder="Conclusion summary..." className="w-full bg-pixelCream dark:bg-royalPurple-900 border-2 border-royalPurple-900 rounded-xl p-3 text-xs focus:outline-none" />
              ) : (
                <p className="text-sm text-slate-700 dark:text-slate-300 italic whitespace-pre-wrap">{sections.conclusion || "No conclusion entered."}</p>
              )}
            </div>

            {/* Section 12: Viva Questions */}
            <div className="pixel-card rounded-3xl p-6 border-3 border-royalPurple-900 space-y-4">
              <h2 className="text-lg font-pixel font-extrabold text-royalPurple-900 dark:text-haldiYellow-400 flex items-center gap-2">
                <Icon name="info" className="w-5 h-5 text-haldiYellow-500" /> 12. Viva Voice Questions & Answers
              </h2>
              <div className="space-y-3">
                {vivaList.map((v, vIdx) => (
                  <div key={vIdx} className="p-4 rounded-xl bg-royalPurple-50 dark:bg-royalPurple-900/50 border-2 border-royalPurple-900 space-y-1">
                    <p className="text-xs font-pixel font-bold text-royalPurple-900 dark:text-haldiYellow-400">Q{vIdx + 1}: {v.q}</p>
                    <p className="text-xs text-slate-700 dark:text-slate-300">Ans: {v.a}</p>
                  </div>
                ))}
              </div>
            </div>

            {/* Section 13: References */}
            <div className="pixel-card rounded-3xl p-6 border-3 border-royalPurple-900 space-y-3">
              <h2 className="text-lg font-pixel font-extrabold text-royalPurple-900 dark:text-haldiYellow-400 flex items-center gap-2">
                <Icon name="book" className="w-5 h-5 text-haldiYellow-500" /> 13. References & Citations
              </h2>
              {isEditing ? (
                <textarea rows="3" value={sections.references} onChange={(e) => updateSectionText('references', e.target.value)} placeholder="Textbooks, documentation links..." className="w-full bg-pixelCream dark:bg-royalPurple-900 border-2 border-royalPurple-900 rounded-xl p-3 text-xs focus:outline-none" />
              ) : (
                <p className="text-xs text-slate-600 dark:text-slate-400 whitespace-pre-wrap">{sections.references || "1. Introduction to Algorithms (CLRS)\n2. GeeksforGeeks DAA Portal"}</p>
              )}
            </div>

            {/* Section 14: Discussion */}
            <div className="pixel-card rounded-3xl p-6 border-3 border-royalPurple-900 space-y-3">
              <h2 className="text-lg font-pixel font-extrabold text-royalPurple-900 dark:text-haldiYellow-400 flex items-center gap-2">
                <Icon name="info" className="w-5 h-5 text-haldiYellow-500" /> 14. Discussion & Edge Cases
              </h2>
              {isEditing ? (
                <textarea rows="3" value={sections.discussion} onChange={(e) => updateSectionText('discussion', e.target.value)} placeholder="Discussion notes..." className="w-full bg-pixelCream dark:bg-royalPurple-900 border-2 border-royalPurple-900 rounded-xl p-3 text-xs focus:outline-none" />
              ) : (
                <p className="text-sm text-slate-700 dark:text-slate-300 whitespace-pre-wrap">{sections.discussion || "Discussion on memory overhead and recursion stack limits."}</p>
              )}
            </div>
          </div>

          {/* Full Screen Code Modal */}
          {fullScreenCode && (
            <div className="fixed inset-0 z-50 p-6 bg-royalPurple-950/90 backdrop-blur-md flex flex-col justify-between font-mono">
              <div className="flex items-center justify-between border-b-2 border-royalPurple-800 pb-4 font-pixel">
                <h3 className="text-lg font-bold text-haldiYellow-400">{fullScreenCode.title} ({fullScreenCode.language})</h3>
                <button onClick={() => setFullScreenCode(null)} className="px-4 py-2 pixel-btn bg-royalPurple-700 text-pixelCream text-xs font-bold rounded-xl">Close</button>
              </div>
              <pre className="flex-1 overflow-auto p-6 text-sm text-pixelCream leading-relaxed">
                <code>{fullScreenCode.code}</code>
              </pre>
            </div>
          )}
        </div>
      );
    };

    // Main App Container
    const App = () => {
      const { isAuthenticated, currentRoute } = useContext(DataContext);

      // MANDATORY LOGIN WALL: Opens Full-Screen World-Class Pixel Login Portal first!
      if (!isAuthenticated) {
        return <LoginPortalScreen />;
      }

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            <Navbar />
            <main>
              {currentRoute.page === 'home' && <HomeView />}
              {currentRoute.page === 'subject' && <SubjectView />}
              {currentRoute.page === 'details' && <PracticalDetailsView />}
            </main>
          </div>
          <ToastBanner />
          <HistoryModal />
          <footer className="py-6 border-t-4 border-royalPurple-900 bg-royalPurple-950 text-haldiYellow-400 font-pixel text-center text-xs">
            PracticalShip — Pixel-Art Academic Practical Universe 🎮
          </footer>
        </div>
      );
    };

    // Render React App
    ReactDOM.createRoot(document.getElementById('root')).render(
      <DataProvider>
        <App />
      </DataProvider>
    );
  </script>
</body>

</html>
